# CHS publishes two Samuel Island stations 0.83 km apart under one name, both
# temporary and established in 1961. CHS's tide tables reference this one to
# Point Atkinson in their Strait of Georgia sub-area. Its position is rounded
# to the minute, which puts it ashore, so it says nothing finer about where on
# the island the gauge stood. The other, in Irish Bay, is samuel-island.

name: Samuel Island (Strait of Georgia)
context: Point Atkinson tables
region: CA-BC
sources:
  - chs-samuel-island-2
# Written by `npm run stations`. Do not edit.
computed:
  sources:
    chs-samuel-island-2:
      position: [48.816667, -123.2]
      coastline: ashore
      metres_inland: 333
